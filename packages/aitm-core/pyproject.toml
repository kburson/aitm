[project]
name = "aitm-core"
version = "0.1.0"
description = "Core records and workflow for AITM"
requires-python = ">=3.13"
dependencies = [
    "packaging>=26,<27",
    "pydantic>=2.13,<3",
    "rfc8785>=0.1,<0.2",
    "ruamel.yaml>=0.18,<0.19",
    "typer>=0.24,<1",
]

[project.scripts]
aitm = "aitm_core.cli.app:main"

[build-system]
requires = ["uv_build==0.10.6"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.16"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
