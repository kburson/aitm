[project]
name = "aitm-usage"
version = "0.1.0"
description = "Private local usage capture for AITM"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
aitm-usage = "aitm_usage.cli:main"

[build-system]
requires = ["uv_build==0.10.6"]
build-backend = "uv_build"

[dependency-groups]
dev = ["coverage==7.17.2", "pytest>=9,<10", "pytest-cov==7.1.0", "pytest-xdist==3.8.0", "ruff>=0.15,<0.16"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["aitm_usage"]
patch = ["subprocess"]
