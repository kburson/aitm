[project]
name = "aitm-usage"
version = "0.1.0"
description = "Private local usage capture for AITM"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
aitm-usage = "aitm_usage.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.16"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
