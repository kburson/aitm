<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src @@SCRIPT_HASH@@; style-src @@STYLE_HASH@@; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Story timing dashboard</title>
<style>
:root {
  color-scheme: light;
  --ink: #14242d;
  --quiet: #485b66;
  --line: #d6e0e5;
  --paper: #fff;
  --soft: #f3f7f8;
  --accent: #065d64;
  --focus: #006f85;
  font: 15px/1.45 Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--ink);
  background: var(--soft);
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
a { color: var(--accent); text-underline-offset: .16em; }
a:hover { text-decoration-thickness: .14em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
main { width: min(100%, 96rem); margin: auto; padding: clamp(1rem, 3vw, 2.5rem); }
h1 { margin: 0 0 1rem; font-size: clamp(1.75rem, 4vw, 2.35rem); line-height: 1.1; }
h2 { margin: 0 0 .55rem; font-size: 1rem; }
h3 { margin: .85rem 0 .35rem; font-size: .95rem; }
p { margin: 0; }
code { font: .84rem ui-monospace, SFMono-Regular, Consolas, monospace; }
.provenance, .workspace { border: 1px solid var(--line); border-radius: .65rem; background: var(--paper); }
.provenance { padding: .8rem 1rem; margin-bottom: 1.1rem; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(13rem, 100%), 1fr)); gap: .55rem 1.3rem; margin: 0; }
.facts > div { min-width: 0; }
dt { font-size: .78rem; font-weight: 700; color: var(--quiet); }
dd { margin: 0; overflow-wrap: anywhere; }
summary { cursor: pointer; width: fit-content; max-width: 100%; color: var(--accent); font-weight: 650; }
.usage { margin-top: .65rem; border-top: 1px solid var(--line); padding-top: .65rem; }
.usage > dl, .usage > p { margin-top: .5rem; }
.toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: .75rem 1rem; padding: .8rem 1rem; }
.filter { display: grid; flex: 1 1 10rem; min-width: 0; gap: .25rem; font-size: .82rem; font-weight: 700; }
select { width: 100%; min-height: 2.35rem; max-width: 100%; padding: .4rem; border: 1px solid #a8bac4; border-radius: .3rem; color: var(--ink); background: var(--paper); font: inherit; }
#result-count { flex: 0 0 auto; padding-block: .45rem; color: var(--quiet); font-size: .86rem; }
.table-wrap { max-width: 100%; overflow: auto; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; text-align: left; }
.story-table { min-width: 61rem; }
th { padding: .55rem .7rem; text-align: left; background: #e9f0f2; color: #293f4a; font-size: .8rem; }
td { padding: .55rem .7rem .3rem; vertical-align: top; }
.story-row > td:first-child { width: 25%; }
.story-name { font-weight: 700; overflow-wrap: anywhere; }
.story-id { display: inline-block; margin-right: .4rem; white-space: nowrap; }
.subtle { display: block; color: var(--quiet); font-size: .79rem; overflow-wrap: anywhere; }
.amount { font-variant-numeric: tabular-nums; font-weight: 670; white-space: nowrap; }
.coverage { display: block; font-size: .76rem; font-weight: 650; }
.coverage[data-coverage="complete"] { color: #236043; }
.coverage[data-coverage="partial"] { color: #80520d; }
.coverage[data-coverage="unknown"] { color: var(--quiet); }
.detail-row > td { padding: 0 .7rem .55rem; border-bottom: 1px solid var(--line); }
.detail-row:last-child > td { border-bottom: 0; }
.story-detail > summary { font-size: .81rem; }
.detail-content { margin: .5rem 0 0; padding: .8rem; background: var(--soft); border: 1px solid var(--line); border-radius: .4rem; }
.measure-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(14.5rem, 100%), 1fr)); gap: .55rem; }
.measure { min-width: 0; padding: .55rem; background: var(--paper); border: 1px solid var(--line); border-radius: .35rem; }
.measure h3 { margin: 0 0 .25rem; }
.measure .facts { margin-top: .35rem; gap: .2rem; }
.measure details { margin-top: .35rem; }
.measure summary { font-size: .8rem; }
.evidence-list { margin: .35rem 0 0; padding-inline-start: 1.2rem; font-size: .82rem; overflow-wrap: anywhere; }
.contributions { margin-top: .7rem; }
.contributions td { border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
#empty-result { padding: .9rem; color: var(--quiet); }
@media (max-width: 42rem) {
  main { padding: .8rem; }
  .toolbar, .provenance { padding: .65rem; }
  .toolbar { gap: .55rem; }
  #result-count { flex: 1 0 100%; padding-block: 0; }
  .story-table { min-width: 55rem; }
  .detail-content { max-width: calc(100vw - 4rem); }
}
</style>
</head>
<body>
<main>
  <h1>Story timing dashboard</h1>
  <section class="provenance" aria-labelledby="snapshot-heading">
    <h2 id="snapshot-heading">Snapshot</h2>
    <dl id="planning-facts" class="facts"></dl>
    <details class="usage" id="usage-report" open>
      <summary>Usage report</summary>
      <dl id="usage-facts" class="facts"></dl>
      <p id="no-usage" class="subtle" hidden>No usage report selected.</p>
    </details>
  </section>
  <section class="workspace" aria-label="Stories">
    <div class="toolbar">
      <label class="filter" for="epic-filter">Epic
        <select id="epic-filter"><option value="">All epics</option></select>
      </label>
      <label class="filter" for="state-filter">State
        <select id="state-filter"><option value="">All states</option></select>
      </label>
      <label class="filter" for="coverage-filter">Actual coverage
        <select id="coverage-filter"><option value="">All coverage</option></select>
      </label>
      <p id="result-count" role="status"></p>
    </div>
    <div class="table-wrap" tabindex="0" role="region" aria-label="Scrollable story timing table">
      <table class="story-table" aria-label="Story timing">
        <thead><tr>
          <th scope="col">Story</th><th scope="col">State</th><th scope="col">Last progress</th>
          <th scope="col">Estimate</th><th scope="col">Actual</th><th scope="col">Elapsed</th>
          <th scope="col">Owner wait</th><th scope="col">Cost (API-equivalent USD)</th>
        </tr></thead>
        <tbody id="story-rows"></tbody>
      </table>
      <p id="empty-result" hidden>No stories match the current filters.</p>
    </div>
    <noscript>This dashboard needs JavaScript to display the local snapshot.</noscript>
  </section>
</main>
<script id="snapshot-data" type="application/json">@@SNAPSHOT@@</script>
<script>
"use strict";

const view = JSON.parse(document.getElementById("snapshot-data").textContent);
const unknown = "Unknown";
const github = "https://github.com/" + view.repository;
const states = {
  backlog: "Backlog", refine: "Refine", "ready-for-plan": "Ready for Planning",
  plan: "Plan", "ready-for-dev": "Ready for Development", develop: "Develop",
  test: "Test", review: "Review", rework: "Rework", retro: "Retro", done: "Done",
  blocked: "Blocked", "on-hold": "On Hold", cancelled: "Cancelled", draft: "Draft",
};
const coverages = {complete: "Complete", partial: "Partial", unknown};
const progressKinds = {
  "core.state.entered": "State entered", "core.doc.accepted": "Document accepted",
  "core.story.graduated": "Story graduated",
};
const hours = new Intl.NumberFormat("en-US", {maximumFractionDigits: 4});

function element(tag, text = null, className = null) {
  const node = document.createElement(tag);
  if (text !== null) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function text(value) {
  return typeof value === "string" && value ? value : unknown;
}

function list(value) {
  return Array.isArray(value) ? value : [];
}

function timestamp(value) {
  if (!value) return element("span", unknown);
  const node = element("time", value.replace("T", " ").replace(/(?:Z|\+00:00)$/, " UTC"));
  node.dateTime = value;
  return node;
}

function link(label, url) {
  if (!url) return element("span", label);
  const node = element("a", label);
  node.href = url;
  node.rel = "noreferrer";
  return node;
}

function fact(dl, label, value, key = null) {
  const item = element("div");
  const term = element("dt", label);
  const description = element("dd");
  if (typeof value === "string") description.textContent = value;
  else description.append(value);
  if (key) item.dataset.field = key;
  item.append(term, description);
  dl.append(item);
}

function labelList(values) {
  return list(values).length ? values.map(text).join(", ") : unknown;
}

function duration(ms) {
  if (!Number.isSafeInteger(ms)) return unknown;
  const wholeSeconds = Math.floor(ms / 1000);
  const h = Math.floor(wholeSeconds / 3600);
  const m = Math.floor(wholeSeconds / 60) % 60;
  const s = wholeSeconds % 60;
  const decimal = (ms % 1000).toString().padStart(3, "0").replace(/0+$/, "");
  const parts = [];
  if (h) parts.push(h + "h");
  if (m) parts.push(m + "m");
  if (s || decimal || !parts.length) parts.push(s + (decimal ? "." + decimal : "") + "s");
  return parts.join(" ");
}

function effort(ms) {
  return Number.isSafeInteger(ms) ? hours.format(ms / 3600000) + " h" : unknown;
}

function exactEffortDuration(parent, ms) {
  if (Number.isSafeInteger(ms)) {
    const exact = element("span", duration(ms), "subtle");
    exact.dataset.field = "exact-duration";
    parent.append(exact);
  }
}

function price(value) {
  return typeof value === "string" ? "$" + value : unknown;
}

function measureValue(parent, value, measure) {
  parent.append(element("span", value, "amount"));
  const coverage = measure.coverage;
  const label = [value === unknown && coverage === "unknown" ? "" : coverages[coverage],
    measure.pending ? "Pending owner response" : ""].filter(Boolean).join(" · ");
  if (label) {
    const indicator = element("span", label, "coverage");
    indicator.dataset.coverage = coverage;
    parent.append(indicator);
  }
}

function estimateValue(parent, estimate) {
  parent.append(element("span", estimate?.agent_hours == null ? unknown : estimate.agent_hours + " h", "amount"));
  if (estimate) {
    const scope = (estimate.phase ? text(estimate.phase) : "Phase unknown") +
      " · " + (list(estimate.roles).length ? labelList(estimate.roles) : "Roles unknown");
    parent.append(element("span", scope, "subtle"));
  }
}

function evidenceLabel(ref) {
  return text(ref?.path ?? ref?.source_ref);
}

function evidenceList(parent, evidence, gaps = []) {
  if (!list(evidence).length && !list(gaps).length) return;
  const disclosure = element("details");
  disclosure.append(element("summary", "Evidence"));
  const items = element("ul", null, "evidence-list");
  for (const ref of list(evidence)) {
    const item = element("li");
    item.append(link(evidenceLabel(ref), ref?.url));
    if (ref?.reason) item.append(element("span", ref.reason, "subtle"));
    items.append(item);
  }
  for (const gap of list(gaps)) {
    const item = element("li");
    item.append(element("span", text(gap?.code) + " · "), link(evidenceLabel(gap?.evidence), gap?.evidence?.url));
    items.append(item);
  }
  disclosure.append(items);
  parent.append(disclosure);
}

function detailMeasure(grid, key, label, measure, formatter, isCost = false) {
  const card = element("section", null, "measure");
  card.dataset.measure = key;
  card.append(element("h3", label));
  const value = isCost ? formatter(measure.priced_usd) : formatter(measure.milliseconds);
  measureValue(card, value, measure);
  if (formatter === effort) exactEffortDuration(card, measure.milliseconds);
  const facts = element("dl", null, "facts");
  fact(facts, "Evidence through", timestamp(measure.evidence_through_utc), "evidence-through");
  fact(facts, "Basis", isCost ? text(measure.basis) : labelList(measure.bases), "basis");
  if (!isCost && list(measure.reasons).length) fact(facts, "Coverage notes", labelList(measure.reasons));
  card.append(facts);
  evidenceList(card, measure.evidence, measure.gaps);
  grid.append(card);
}

function contributionDetail(parent, contributions) {
  if (!list(contributions).length) return;
  const details = element("details", null, "contributions");
  details.append(element("summary", "Phase and role contributions"));
  const table = element("table");
  const heading = element("tr");
  for (const label of ["Story", "Actor", "Phase", "Role", "Attempt", "Actual"]) {
    const th = element("th", label);
    th.scope = "col";
    heading.append(th);
  }
  table.append(element("thead"));
  table.tHead.append(heading);
  const body = table.createTBody();
  for (const row of contributions) {
    const tr = body.insertRow();
    const subject = tr.insertCell();
    subject.append(link("#" + row.story, github + "/issues/" + row.story));
    for (const label of [text(row.actor), text(row.phase), text(row.role), text(row.attempt), effort(row.milliseconds)]) {
      tr.insertCell().textContent = label;
    }
  }
  details.append(table);
  parent.append(details);
}

function detailsFor(story) {
  const body = element("div", null, "detail-content");
  const facts = element("dl", null, "facts");
  if (story.estimate) {
    fact(facts, "Estimate basis", text(story.estimate.basis));
    const evidence = story.estimate.evidence;
    if (evidence?.path) fact(facts, "Estimate evidence", link(evidenceLabel(evidence), evidence.url));
  }
  if (story.descendants.length) fact(facts, "Descendants", story.descendants.map(id => "#" + id).join(", "));
  if (facts.children.length) body.append(facts);
  body.append(element("h3", "Timing measures"));
  const grid = element("div", null, "measure-grid");
  const measures = [
    ["direct_actual", "Direct Actual", effort],
    ["descendant_actual", "Descendant Actual", effort],
    ["actual", "Inclusive Actual", effort],
    ["working_wall", "Observed working wall time", duration],
    ["all_phase_elapsed", "All-phase elapsed", duration],
    ["all_phase_age", "All-phase age", duration],
    ["implementation_elapsed", "Implementation elapsed", duration],
    ["implementation_age", "Implementation age", duration],
    ["direct_owner_wait", "Direct owner wait", duration],
    ["owner_wait", "Inclusive owner wait", duration],
  ];
  for (const [key, label, formatter] of measures) detailMeasure(grid, key, label, story.timing[key], formatter);
  body.append(grid);
  contributionDetail(body, story.timing.contributions);
  body.append(element("h3", "Cost (API-equivalent USD)"));
  const costs = element("div", null, "measure-grid");
  detailMeasure(costs, "direct_cost", "Direct Cost", story.cost.direct, price, true);
  detailMeasure(costs, "inclusive_cost", "Inclusive Cost", story.cost.inclusive, price, true);
  body.append(costs);
  return body;
}

function tableCell(row, key) {
  const cell = row.insertCell();
  cell.dataset.field = key;
  return cell;
}

function storyRows(story, table) {
  const row = table.insertRow();
  row.className = "story-row";
  row.dataset.storyId = story.id;
  const storyCell = tableCell(row, "story");
  const name = element("div", null, "story-name");
  const idLink = link("#" + story.id, github + "/issues/" + story.id);
  idLink.className = "story-id";
  name.append(idLink, document.createTextNode(story.title));
  storyCell.append(name);
  tableCell(row, "state").textContent = states[story.state] ?? unknown;
  const progress = tableCell(row, "progress");
  if (story.last_progress) {
    const happened = timestamp(story.last_progress.occurred_at_utc);
    const evidence = story.last_progress.evidence;
    if (evidence?.url) {
      const anchor = link("", evidence.url);
      anchor.append(happened);
      progress.append(anchor);
    } else progress.append(happened);
    progress.append(element("span", progressKinds[story.last_progress.kind] ?? unknown, "subtle"));
  } else progress.textContent = unknown;
  estimateValue(tableCell(row, "estimate"), story.estimate);
  const actual = tableCell(row, "actual");
  measureValue(actual, effort(story.timing.actual.milliseconds), story.timing.actual);
  exactEffortDuration(actual, story.timing.actual.milliseconds);

  const elapsed = tableCell(row, "elapsed");
  const elapsedMeasure = story.timing.all_phase_elapsed;
  const age = story.timing.all_phase_age;
  const showAge = elapsedMeasure.milliseconds == null && age.milliseconds != null;
  measureValue(elapsed, duration((showAge ? age : elapsedMeasure).milliseconds), showAge ? age : elapsedMeasure);
  elapsed.append(element("span", showAge ? "All-phase age" : "All-phase elapsed", "subtle"));
  measureValue(tableCell(row, "owner-wait"), duration(story.timing.owner_wait.milliseconds), story.timing.owner_wait);
  measureValue(tableCell(row, "cost"), price(story.cost.inclusive.priced_usd), story.cost.inclusive);

  const detailRow = table.insertRow();
  detailRow.className = "detail-row";
  detailRow.dataset.detailFor = story.id;
  const cell = detailRow.insertCell();
  cell.colSpan = row.cells.length;
  const disclosure = element("details", null, "story-detail");
  const summary = element("summary", "Timing and evidence");
  summary.setAttribute("aria-label", "Timing and evidence for story #" + story.id);
  disclosure.append(summary);
  disclosure.addEventListener("toggle", () => {
    if (disclosure.open && disclosure.childElementCount === 1) disclosure.append(detailsFor(story));
  });
  cell.append(disclosure);
  return {story, row, detailRow};
}

function addOptions(select, options) {
  for (const [value, label] of options) {
    const option = element("option", label);
    option.value = value;
    select.append(option);
  }
}

const planning = document.getElementById("planning-facts");
fact(planning, "Planning commit", element("code", view.planning.commit), "planning-commit");
fact(planning, "Committer time", timestamp(view.planning.committed_at_utc), "committer-time");
fact(planning, "Snapshot as-of", timestamp(view.planning.as_of_utc), "snapshot-as-of");
const usage = document.getElementById("usage-facts");
const selector = view.usage_report.selector;
if (selector) {
  fact(usage, "Report", text(selector.report_id), "usage-report-id");
  fact(usage, "Project", text(selector.project));
  fact(usage, "Window start", timestamp(selector.window_start_utc));
  fact(usage, "Window end", timestamp(selector.window_end_utc));
  fact(usage, "Usage cutoff", timestamp(selector.cutoff_utc), "usage-cutoff");
  fact(usage, "Rate card", text(selector.rate_card), "usage-rate-card");
  fact(usage, "Pricing basis", text(selector.pricing_basis), "usage-basis");
} else document.getElementById("no-usage").hidden = false;

const epicFilter = document.getElementById("epic-filter");
const stateFilter = document.getElementById("state-filter");
const coverageFilter = document.getElementById("coverage-filter");
const epics = new Map(view.stories.filter(story => story.descendants.length).map(story => [
  String(story.id), new Set([story.id, ...story.descendants]),
]));
addOptions(epicFilter, view.stories.filter(story => epics.has(String(story.id))).map(story => [
  String(story.id), "#" + story.id + " " + story.title,
]));
const usedStates = new Set(view.stories.map(story => story.state));
addOptions(stateFilter, Object.entries(states).filter(([state]) => usedStates.has(state)));
if (usedStates.has(null)) addOptions(stateFilter, [["unknown", unknown]]);
addOptions(coverageFilter, Object.entries(coverages));

const table = document.getElementById("story-rows");
const entries = view.stories.map(story => storyRows(story, table));
function filterRows() {
  const subjects = epics.get(epicFilter.value);
  let count = 0;
  for (const {story, row, detailRow} of entries) {
    const visible = (!subjects || subjects.has(story.id)) &&
      (!stateFilter.value || (story.state ?? "unknown") === stateFilter.value) &&
      (!coverageFilter.value || story.timing.actual.coverage === coverageFilter.value);
    row.hidden = detailRow.hidden = !visible;
    if (visible) count++;
  }
  document.getElementById("result-count").textContent = count + " of " + entries.length + " stories";
  document.getElementById("empty-result").hidden = count !== 0;
}
for (const filter of [epicFilter, stateFilter, coverageFilter]) filter.addEventListener("change", filterRows);
filterRows();
document.documentElement.dataset.ready = "true";
</script>
</body>
</html>
