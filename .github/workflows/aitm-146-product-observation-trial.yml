name: 146 product observation trial

on:
  push:
    branches: [codex/146-product-observation-trial]

permissions:
  contents: read

jobs:
  observation:
    if: github.repository == 'kburson/aitm' && github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.10.6'
          enable-cache: false
      - name: Observe exact product suite as an unprivileged worker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I .github/spikes/146/controller.py "$RUNNER_TEMP/aitm-146/receipt.json"
      - name: Retain controller receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: product-146-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/aitm-146/receipt.json
          if-no-files-found: error
          retention-days: 14
