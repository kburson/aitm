name: macOS native filesystem checks

on:
  pull_request:
    paths:
      - 'packages/aitm-usage/src/aitm_usage/host_fs.py'
      - 'packages/aitm-usage/src/aitm_usage/host_watch.py'
      - 'packages/aitm-usage/native-tests/**'
      - 'packages/aitm-usage/tests/test_host_fs_publication.py'
      - 'packages/aitm-usage/tests/test_host_watch.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: Darwin ACL, FSEvents and atomic rename
    runs-on: macos-15
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/aitm-usage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.6'
          python-version: '3.13.9'
          enable-cache: false
      - name: Test native filesystem behavior
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv run --locked pytest -q native-tests tests/test_host_fs_publication.py tests/test_host_watch.py
