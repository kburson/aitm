name: Publish scheduled sweep advisory

on:
  workflow_run:
    workflows: [Category full sweep]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-category-sweep-advisory
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'kburson/aitm' &&
      github.repository_id == '1450406435' &&
      github.ref == 'refs/heads/trunk' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.workflow_id == 425235652 &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.head_branch == 'trunk' &&
        github.event.workflow_run.head_repository.id == 1450406435))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.6'
          python-version: '3.13.9'
          enable-cache: false
      - name: Reconcile and read back the advisory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/scheduled_sweep_flag.py publish
