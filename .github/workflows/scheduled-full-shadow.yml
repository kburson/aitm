name: Scheduled full suite shadow

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite-shadow:
    if: github.ref == 'refs/heads/trunk' && github.event.repository.default_branch == 'trunk'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.6'
          python-version: '3.13.9'
          enable-cache: false
      - name: Run full shadow scope
        shell: bash
        run: bash tools/ci/run_scheduled_shadow.sh "$RUNNER_TEMP/aitm-scheduled-shadow"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aitm-scheduled-shadow-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/aitm-scheduled-shadow/receipt.json
          if-no-files-found: error
          retention-days: 14
