name: Fast story validation shadow

on:
  workflow_dispatch:
    inputs:
      admission:
        description: Immutable admission revision on protected planning
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  bounded-fast-story-shadow:
    if: github.ref == 'refs/heads/trunk' && github.event.repository.default_branch == 'trunk'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.6'
          python-version: '3.13.9'
          enable-cache: false
      - name: Verify reviewed input and run bounded shadow
        shell: bash
        env:
          ADMISSION: ${{ inputs.admission }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -sm)" = "Darwin arm64"
          device=$(df -P "$RUNNER_TEMP" | awk 'NR==2 {print $1}')
          test "$(diskutil info -plist "$device" | plutil -extract FilesystemType raw -)" = apfs
          work=$(mktemp -d "$RUNNER_TEMP/aitm-fast-shadow.XXXXXXXX")
          mkdir "$RUNNER_TEMP/aitm-fast-evidence"
          uv run --no-project --python 3.13.9 python tools/ci/ci_fast_story_shadow.py \
            "$ADMISSION" "$work" "$RUNNER_TEMP/aitm-fast-evidence/receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aitm-fast-shadow-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/aitm-fast-evidence/receipt.json
          if-no-files-found: error
          retention-days: 14
