name: 398 Ubuntu production suite shadow

on:
  push:
    branches: [codex/398-shadow-run]

permissions:
  contents: read

jobs:
  compare:
    name: shadow / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case:
          - bounded
          - seeded
          - shared-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f2ff2b6f073fa769261b44fb0c05a055da7eb1c9
          path: trusted
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.10.6'
          enable-cache: false
      - name: Install the workflow-pinned GitHub CLI for helper tests
        shell: bash
        run: |
          asset=gh_2.97.0_linux_amd64.tar.gz
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/cli/cli/releases/download/v2.97.0/$asset" -o "$asset"
          printf '%s  %s\n' a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112 "$asset" | sha256sum -c -
          tar -xzf "$asset"
          printf '%s\n' "$RUNNER_TEMP/gh_2.97.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Compare exact PR inputs and Ubuntu outcomes
        working-directory: trusted
        env:
          SHADOW_CASE: ${{ matrix.case }}
        shell: bash
        run: |
          export UV_PYTHON_INSTALL_DIR
          UV_PYTHON_INSTALL_DIR=$(mktemp -d /var/tmp/aitm-398-python.XXXXXXXX)
          uv python install 3.13.9
          python_bin=$(find "$UV_PYTHON_INSTALL_DIR" -path '*/bin/python3.13' -type f)
          test -x "$python_bin"
          export PATH="$(dirname "$python_bin"):$PATH"
          "$python_bin" -B ../shadow-398/shadow.py \
            "$SHADOW_CASE" ../shadow-398/matrix.json "$RUNNER_TEMP/shadow-evidence"
      - name: Save advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shadow-398-${{ matrix.case }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/shadow-evidence
          if-no-files-found: error
          retention-days: 30
