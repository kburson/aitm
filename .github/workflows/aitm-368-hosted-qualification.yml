name: 368 hosted macOS qualification

on:
  push:
    branches: [codex/368-hosted-qualification]

permissions:
  contents: read
  actions: read

jobs:
  integrated:
    if: github.repository == 'kburson/aitm' && github.ref == 'refs/heads/codex/368-hosted-qualification' && github.actor == 'kburson'
    runs-on: macos-26
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check trace intake
        run: python3 -B -m unittest discover -s .github/spikes/368
      - name: Authenticate the admitted runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -B -I .github/spikes/368/integrated.py --fetch "$RUNNER_TEMP/aitm368-admitted.zip"
      - name: Observe the exact reviewed assignment
        run: python3 -B -I .github/spikes/368/integrated.py "$RUNNER_TEMP/aitm368-evidence" "$RUNNER_TEMP/aitm368-admitted.zip"
      - name: Publish screened controller evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aitm368-integrated-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/aitm368-evidence/published/*
          if-no-files-found: error
          retention-days: 14
