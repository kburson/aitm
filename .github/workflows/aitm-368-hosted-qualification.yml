name: 368 hosted macOS qualification

on:
  push:
    branches: [codex/368-hosted-qualification]

permissions:
  contents: read

jobs:
  admission:
    if: github.repository == 'kburson/aitm' && github.ref == 'refs/heads/codex/368-hosted-qualification' && github.actor == 'kburson'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.10.6'
          enable-cache: false
      - name: Check trace intake
        run: python3 -B -m unittest discover -s .github/spikes/368
      - name: Observe the fresh hosted boundary
        run: python3 -B -I .github/spikes/368/admission.py "$RUNNER_TEMP/aitm368-evidence"
      - name: Publish screened controller evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aitm368-admission-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/aitm368-evidence/published/*
          if-no-files-found: error
          retention-days: 14
