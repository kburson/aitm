name: CI

on:
  pull_request:
    branches: [trunk]
    types: [synchronize]

permissions: {}

jobs:
  binding-probe-collect:
    if: >-
      github.repository == 'kburson/aitm' &&
      github.actor == 'kburson' &&
      github.run_attempt == '1' &&
      github.event.number == 107 &&
      github.event.pull_request.draft &&
      github.event.repository.visibility == 'public' &&
      github.event.pull_request.base.sha == 'f80f22645e2008c4cac9dc6e4003640bba976b5f' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/aitm-104-ci-bootstrap' &&
      github.event.before == 'd34921e0dd604abb2af5b710031d8e4a85c76cee'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify the checkout and write a fixed probe subject
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/pull/107/merge
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base=$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
          head=$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          test "$(jq -er '.after' "$GITHUB_EVENT_PATH")" = "$head"
          test "$(git cat-file -p HEAD | awk '/^$/{exit} /^parent /{print $2}')" = "$(printf '%s\n%s' "$base" "$head")"
          mkdir "$RUNNER_TEMP/binding-subject"
          printf '%s\n' '{"probe":"aitm-104-ordinary-pr-binding-v1"}' > "$RUNNER_TEMP/binding-subject/candidate.json"
          printf 'Observed exact checkout %s\n' "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: aitm-ci-collector-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/binding-subject/candidate.json
          if-no-files-found: error
          overwrite: false

  binding-probe-sign:
    needs: binding-probe-collect
    if: github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Authorize the exact collector archive
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTOR_ID: ${{ needs.binding-probe-collect.outputs.artifact-id }}
          COLLECTOR_DIGEST: ${{ needs.binding-probe-collect.outputs.artifact-digest }}
        shell: bash
        run: |
          [[ "$COLLECTOR_ID" =~ ^[1-9][0-9]*$ ]]
          digest="${COLLECTOR_DIGEST#sha256:}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          expected_name="aitm-ci-collector-a$GITHUB_RUN_ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$COLLECTOR_ID" |
            jq -e --arg id "$COLLECTOR_ID" --arg run "$GITHUB_RUN_ID" \
              --arg name "$expected_name" --arg digest "sha256:$digest" '
              (.id | tostring) == $id and
              (.workflow_run.id | tostring) == $run and
              .name == $name and .digest == $digest and
              .expired == false and
              (.size_in_bytes | type == "number" and . > 0 and . <= 2097152)
            ' > /dev/null
          printf 'id=%s\ndigest=%s\n' "$COLLECTOR_ID" "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.authorize.outputs.id }}
          path: ${{ runner.temp }}/binding-raw
          skip-decompress: true
          digest-mismatch: error
      - name: Validate the archive and recover only the fixed subject
        env:
          EXPECTED_SHA256: ${{ steps.authorize.outputs.digest }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import stat
          import zipfile

          root = Path(os.environ["RUNNER_TEMP"])
          archive, = (root / "binding-raw").iterdir()
          if not stat.S_ISREG(archive.lstat().st_mode) or archive.stat().st_size > 2**21:
              raise SystemExit("invalid raw artifact")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ["EXPECTED_SHA256"]:
              raise SystemExit("collector archive digest mismatch")
          with zipfile.ZipFile(archive) as package:
              member, = package.infolist()
              mode = stat.S_IFMT(member.external_attr >> 16)
              if member.orig_filename != "candidate.json" or mode not in (0, stat.S_IFREG) or member.file_size > 2**20:
                  raise SystemExit("invalid collector archive member")
              with package.open(member) as source:
                  subject = source.read(2**20 + 1)
          if subject != b'{"probe":"aitm-104-ordinary-pr-binding-v1"}\n':
              raise SystemExit("unexpected probe subject")
          destination = root / "binding-signed"
          destination.mkdir()
          (destination / "candidate.json").write_bytes(subject)
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: ${{ runner.temp }}/binding-signed/candidate.json
          push-to-registry: false
          create-storage-record: false
      - name: Copy the bundle to the evidence directory
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          test -f "$BUNDLE_PATH"
          test ! -L "$BUNDLE_PATH"
          cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/binding-signed/attestation.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aitm-ci-binding-probe-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/binding-signed/
          if-no-files-found: error
          overwrite: false
