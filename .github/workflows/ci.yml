name: CI

'on':
  pull_request:
    branches: [trunk]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  binding-observation:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Observe hosted run identity
        shell: bash
        run: |
          printf 'run=%s attempt=%s ref=%s workflow_sha=%s tested_sha=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REF" \
            "$GITHUB_WORKFLOW_SHA" "$GITHUB_SHA"
          jq -ce '{number, base_ref: .pull_request.base.ref,
            base_sha: .pull_request.base.sha, head_ref: .pull_request.head.ref,
            head_sha: .pull_request.head.sha,
            event_merge_sha: .pull_request.merge_commit_sha}' "$GITHUB_EVENT_PATH"
          printf 'image=%s version=%s runner_os=%s runner_arch=%s\n' \
            "$ImageOS" "$ImageVersion" "$RUNNER_OS" "$RUNNER_ARCH"
          sw_vers -productVersion
          uname -m
          xcodebuild -version
