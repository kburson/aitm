name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [trunk]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.13.9'
  UV_VERSION: '0.10.6'
  BOOTSTRAP_BASE: f80f22645e2008c4cac9dc6e4003640bba976b5f
  # Initial observer and policy are pinned after independent bootstrap review.
  BOOTSTRAP_OBSERVER_BLOB: 839b73cdcc1e44f45af78bcebdbf53e9adfeee67
  BOOTSTRAP_OBSERVER_SHA: dd08c448cafe1ef0e6f5b8eba660d8485bfe76657c109c5249e86efd735025d1
  BOOTSTRAP_POLICY_BLOB: b93942fb31a999702ed1c2ad14035b1a5a1d22a4
  BOOTSTRAP_POLICY_SHA: dae97b53685c6c5f079de479ef49a0dfb5c522f4c2aae9a8bfdc5618286c71a2

jobs:
  python-base:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      checkout: ${{ steps.source.outputs.commit }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Run isolated trusted base inventory and outcomes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$BASE"
          root=$(pwd -P)
          out="$RUNNER_TEMP/aitm-base"
          mkdir -p "$out/observer" "$out/evidence"
          if [[ -f tools/ci/pytest_evidence.py && -f tools/ci/policy.json ]]; then
            git show HEAD:tools/ci/pytest_evidence.py > "$out/observer/pytest_evidence.py"
            git show HEAD:tools/ci/policy.json > "$out/observer/policy.json"
          else
            test "$BASE" = "$BOOTSTRAP_BASE"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$BOOTSTRAP_OBSERVER_BLOB" --jq .content |
              python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > "$out/observer/pytest_evidence.py"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$BOOTSTRAP_POLICY_BLOB" --jq .content |
              python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > "$out/observer/policy.json"
            test "$(shasum -a 256 "$out/observer/pytest_evidence.py" | cut -d' ' -f1)" = "$BOOTSTRAP_OBSERVER_SHA"
            test "$(shasum -a 256 "$out/observer/policy.json" | cut -d' ' -f1)" = "$BOOTSTRAP_POLICY_SHA"
          fi
          cp "$out/observer/policy.json" "$out/evidence/base-policy.json"
          uv sync --project packages/aitm-usage --locked --python "$PYTHON_VERSION"
          # Keep native fixtures away from the shared system temp directory and evidence output.
          fixtures=$(mktemp -d "$RUNNER_TEMP/aitm-base-fixtures.XXXXXXXX")
          PYTHONPATH="$out/observer" AITM_CI_PYTEST_EVIDENCE="$out/outcomes.json" \
            uv run --project packages/aitm-usage --locked pytest -p pytest_evidence --rootdir "$root" \
              --basetemp "$fixtures/pytest" -q packages/aitm-usage/tests
          cd packages/aitm-usage
          sha() { shasum -a 256 "$1" | cut -d' ' -f1; }
          jq -n --arg base "$BASE" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg observer "$(sha "$out/observer/pytest_evidence.py")" --arg policy "$(sha "$out/observer/policy.json")" \
            --arg lock "$(sha uv.lock)" --arg configuration "$(sha pyproject.toml)" \
            --arg runtime "$(uv run --locked python -c 'import platform; print(platform.python_version())')" \
            --arg image "${ImageOS:?}:${ImageVersion:?}" --slurpfile evidence "$out/outcomes.json" \
            '{identity:{$base,$tree,$observer,$policy,$lock,$configuration,$runtime,$image},evidence:$evidence[0]}' > "$out/evidence/base.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: aitm-ci-base-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/aitm-base/evidence/
          if-no-files-found: error

  python:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      checkout: ${{ steps.source.outputs.commit }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        id: uv
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: packages/aitm-usage/uv.lock
          cache-suffix: macos-26-python-3.13.9
      - name: Qualify and record exact candidate inputs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          root=$(pwd -P)
          out="$RUNNER_TEMP/aitm-python"
          mkdir -p "$out/evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$(git cat-file -p HEAD | awk '/^$/{exit} /^parent /{print $2}')" = "$(printf '%s\n%s' "$BASE" "$PR_HEAD")"
            sha() { shasum -a 256 | cut -d' ' -f1; }
            if git cat-file -e "$BASE:tools/ci/pytest_evidence.py" 2>/dev/null && git cat-file -e "$BASE:tools/ci/policy.json" 2>/dev/null; then
              observer=$(git show "$BASE:tools/ci/pytest_evidence.py" | sha)
              policy=$(git show "$BASE:tools/ci/policy.json" | sha)
            else
              test "$BASE" = "$BOOTSTRAP_BASE"
              observer=$BOOTSTRAP_OBSERVER_SHA
              policy=$BOOTSTRAP_POLICY_SHA
            fi
            jq -n --arg base "$BASE" --arg tree "$(git rev-parse "$BASE^{tree}")" \
              --arg observer "$observer" --arg policy "$policy" \
              --arg lock "$(git show "$BASE:packages/aitm-usage/uv.lock" | sha)" \
              --arg configuration "$(git show "$BASE:packages/aitm-usage/pyproject.toml" | sha)" \
              --arg runtime "$PYTHON_VERSION" --arg image "${ImageOS:?}:${ImageVersion:?}" \
              '{$base,$tree,$observer,$policy,$lock,$configuration,$runtime,$image}' > "$out/evidence/expected-base.json"
          fi
          device=$(df -P "$RUNNER_TEMP" | awk 'NR==2 {print $1}')
          filesystem=$(diskutil info -plist "$device" | plutil -extract FilesystemType raw -)
          jq -n --arg os "$(uname -s)" --arg filesystem "$filesystem" \
            --arg image "${ImageOS:?}:${ImageVersion:?}" --arg xcode "$(xcodebuild -version)" \
            '{$os,$filesystem,$image,$xcode}' > "$out/evidence/capability.json"
          test "$filesystem" = apfs
          test -d "$root/packages/aitm-usage/src/aitm_usage"
          git ls-tree -r --name-only -z HEAD -- packages/aitm-usage/src/aitm_usage |
            python3 -c 'import json,sys; paths=sys.stdin.buffer.read().decode().split(chr(0)); print(json.dumps([p.removeprefix("packages/aitm-usage/") for p in paths if p.endswith(".py")]))' \
              > "$out/evidence/product-inventory.json"
      - name: Run serial behavior suite and retain exact coverage
        env:
          UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        shell: bash
        run: |
          root=$(pwd -P)
          out="$RUNNER_TEMP/aitm-python"
          start=$(date +%s)
          cd packages/aitm-usage
          uv sync --locked --python "$PYTHON_VERSION"
          ready=$(date +%s)
          export PYTHONPATH="$root/tools/ci" AITM_CI_PYTEST_EVIDENCE="$out/evidence/pytest.json"
          export AITM_CI_CHILD_EVIDENCE=1 COVERAGE_FILE="$out/.product"
          # Keep native fixtures away from the shared system temp directory and coverage output.
          fixtures=$(mktemp -d "$RUNNER_TEMP/aitm-python-fixtures.XXXXXXXX")
          uv run --locked coverage run -m pytest -p pytest_evidence --rootdir "$root" -q \
            --basetemp "$fixtures/pytest" --junitxml="$out/evidence/product-junit.xml" \
            --durations=15 tests "$root/tools/ci/tests/test_cli_evidence.py"
          uv run --locked python - "$out" <<'PY'
          import json
          import sys
          from pathlib import Path
          from python_gate import collect_child_coverage

          root = Path(sys.argv[1])
          result = collect_child_coverage(json.loads((root / "evidence/pytest.json").read_text()), root / ".product")
          (root / "evidence/children.json").write_text(json.dumps(result))
          PY
          uv run --locked coverage combine --keep
          uv run --locked coverage json -o "$out/evidence/product-coverage.json"
          cd "$root"
          unset AITM_CI_PYTEST_EVIDENCE AITM_CI_CHILD_EVIDENCE
          gh_asset=gh_2.97.0_macOS_arm64.zip
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/cli/cli/releases/download/v2.97.0/$gh_asset" -o "$out/$gh_asset"
          (cd "$out" && printf '%s  %s\n' a58b8fd77b417a38f47a0b54d1370c59b0fcdb324ccc9ca002b0998f7c4c999e "$gh_asset" | shasum -a 256 -c -)
          unzip -q "$out/$gh_asset" -d "$out"
          export PATH="$out/gh_2.97.0_macOS_arm64/bin:$PATH"
          printf '%s\n' '[run]' 'branch = True' 'relative_files = True' 'source = tools/ci' 'omit = tools/ci/tests/*' 'patch = subprocess' > "$out/helper.coveragerc"
          COVERAGE_FILE="$out/.helpers" packages/aitm-usage/.venv/bin/python -m pytest -q \
            --cov=tools/ci --cov-config="$out/helper.coveragerc" --cov-report=json:"$out/evidence/helper-coverage.json" \
            tools/ci/tests/test_python_gate.py tools/ci/tests/test_pytest_evidence.py \
            tools/ci/tests/test_verify_pr.py tools/ci/tests/test_file_checks.py
          cache=cold
          if [[ "$UV_CACHE_HIT" == true ]]; then cache=warm; fi
          jq -n --argjson setup "$((ready - start))" --argjson test "$(($(date +%s) - ready))" \
            --argjson started "$start" --arg cache "$cache" '{$setup,$test,$started,$cache}' > "$out/timings.json"
      - name: Build and smoke-test the exact installed wheel
        shell: bash
        run: |
          out="$RUNNER_TEMP/aitm-python"
          cd packages/aitm-usage
          uv build --wheel --no-sources --out-dir "$out/wheel"
          wheels=("$out"/wheel/*.whl)
          test "${#wheels[@]}" = 1
          wheel=${wheels[0]}
          shasum -a 256 "$wheel" > "$out/wheel.sha256"
          uv export --locked --no-dev --no-emit-project --format requirements.txt > "$out/runtime.txt"
          uv venv --python "$PYTHON_VERSION" "$out/install"
          uv pip sync --python "$out/install/bin/python" "$out/runtime.txt"
          shasum -a 256 -c "$out/wheel.sha256"
          uv pip install --python "$out/install/bin/python" --no-deps "$wheel"
          "$out/install/bin/python" -I -c 'from pathlib import Path; import sys, aitm_usage; assert Path(aitm_usage.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())'
          "$out/install/bin/aitm-usage" --help > "$out/help"
          grep -q 'usage: aitm-usage' "$out/help"
          jq --argjson end "$(date +%s)" '. + {total:($end-.started)} | del(.started)' "$out/timings.json" > "$out/evidence/timings.json"
          jq -n --arg digest "$(cut -d' ' -f1 "$out/wheel.sha256")" '{$digest}' > "$out/evidence/wheel.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: aitm-ci-python-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/aitm-python/evidence/
          if-no-files-found: error

  quality:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    outputs:
      checkout: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: packages/aitm-usage/uv.lock
          cache-suffix: ubuntu-24.04-python-3.13.9
      - name: Lint and format checks
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv sync --project packages/aitm-usage --locked --python "$PYTHON_VERSION"
          ruff=packages/aitm-usage/.venv/bin/ruff
          (cd packages/aitm-usage && .venv/bin/ruff check . && .venv/bin/ruff format --check .)
          "$ruff" check --config packages/aitm-usage/pyproject.toml tools/ci
          "$ruff" format --check --config packages/aitm-usage/pyproject.toml tools/ci
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  file-checks:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    outputs:
      checkout: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Check tracked Markdown, YAML and JSON
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --prefix tools/ci/file-lint --ignore-scripts --no-audit --no-fund
          uv sync --project tools/ci/file-lint --locked --python "$PYTHON_VERSION"
          uv run --project packages/aitm-usage --locked --no-dev --python "$PYTHON_VERSION" \
            python tools/ci/file_checks.py --root . \
              --markdownlint tools/ci/file-lint/node_modules/.bin/markdownlint-cli2 \
              --yamllint tools/ci/file-lint/.venv/bin/yamllint

  collect-evidence:
    if: always() && !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [python-base, python, quality, file-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check every required dependency and its checkout and artifact custody
        id: custody
        env:
          NEEDS: ${{ toJSON(needs) }}
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mode='push'
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then mode='pr'; fi
          printf '%s\n' "$NEEDS" > "$RUNNER_TEMP/aitm-needs.json"
          python3 tools/ci/python_gate.py --mode "$mode" --policy tools/ci/policy.json --needs "$RUNNER_TEMP/aitm-needs.json"
          jq -e --arg merge "$GITHUB_SHA" --arg base "$BASE" --arg mode "$mode" '
            .python.outputs.checkout==$merge and .quality.outputs.checkout==$merge and
            ."file-checks".outputs.checkout==$merge and
            ($mode=="push" or ."python-base".outputs.checkout==$base)
          ' "$RUNNER_TEMP/aitm-needs.json" >/dev/null
          check_artifact() {
            local lane=$1 name=$2 id digest
            id=$(jq -er --arg lane "$lane" '.[$lane].outputs."artifact-id"' "$RUNNER_TEMP/aitm-needs.json")
            digest=$(jq -er --arg lane "$lane" '.[$lane].outputs."artifact-digest"' "$RUNNER_TEMP/aitm-needs.json")
            digest="${digest#sha256:}"
            [[ "$id" =~ ^[1-9][0-9]*$ && "$digest" =~ ^[0-9a-f]{64}$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" |
              jq -e --arg id "$id" --arg run "$GITHUB_RUN_ID" --arg name "$name" --arg digest "sha256:$digest" '
                (.id|tostring)==$id and (.workflow_run.id|tostring)==$run and
                .name==$name and .digest==$digest and .expired==false
              ' >/dev/null
            printf '%s-id=%s\n' "$lane" "$id" >> "$GITHUB_OUTPUT"
          }
          check_artifact python "aitm-ci-python-a$GITHUB_RUN_ATTEMPT"
          if [[ "$mode" == pr ]]; then
            check_artifact python-base "aitm-ci-base-a$GITHUB_RUN_ATTEMPT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.custody.outputs.python-id }}
          path: ${{ runner.temp }}/aitm-candidate
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'pull_request'
        with:
          artifact-ids: ${{ steps.custody.outputs.python-base-id }}
          path: ${{ runner.temp }}/aitm-baseline
          digest-mismatch: error
      - name: Evaluate required evidence and assemble the candidate
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
        shell: bash
        run: |
          input="$RUNNER_TEMP/aitm-candidate"
          out="$RUNNER_TEMP/aitm-collector"
          mkdir "$out"
          mode='push'
          base_args=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            mode='pr'
            base_args=(--base-evidence "$RUNNER_TEMP/aitm-baseline/base.json"
                       --base-policy "$RUNNER_TEMP/aitm-baseline/base-policy.json"
                       --expected-base "$input/expected-base.json")
          fi
          python3 tools/ci/python_gate.py --mode "$mode" --policy tools/ci/policy.json \
            --inventory "$input/pytest.json" --outcomes "$input/pytest.json" \
            --coverage "$input/product-coverage.json" --product-inventory "$input/product-inventory.json" \
            --helpers "$input/helper-coverage.json" \
            --child-evidence "$input/children.json" --capability "$input/capability.json" \
            "${base_args[@]}" > "$out/disposition.json"
          cat "$out/disposition.json"
          if [[ "$mode" == pr ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$out/run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" > "$out/jobs.json"
            jq -n --slurpfile run "$out/run.json" --slurpfile jobs "$out/jobs.json" '
              ($jobs[0].jobs | map(select(.name=="python"))) as $matches |
              if ($matches|length)!=1 then error("ambiguous Python lane") else
                ($matches[0].started_at|fromdateiso8601) as $start |
                {hosted_seconds:(($matches[0].completed_at|fromdateiso8601)-$start),
                 queue:(if $run[0].run_attempt==1 then $start-($run[0].created_at|fromdateiso8601) else null end)}
              end' > "$out/provider-timing.json"
            jq -n --arg schema aitm.ci-candidate/v2 --argjson run "$GITHUB_RUN_ID" \
              --argjson attempt "$GITHUB_RUN_ATTEMPT" --argjson pr "$PR_NUMBER" \
              --arg head "$PR_HEAD" --arg base "$BASE" --arg tested "$GITHUB_SHA" \
              --arg tree "$(git rev-parse 'HEAD^{tree}')" --argjson jobs "$JOB_RESULTS" \
              --arg policy "$(git rev-parse HEAD:tools/ci/policy.json)" \
              --arg workflow "$(git rev-parse HEAD:.github/workflows/ci.yml)" \
              --arg observer "$(git rev-parse HEAD:tools/ci/pytest_evidence.py)" \
              --arg gate "$(git rev-parse HEAD:tools/ci/python_gate.py)" \
              --arg verifier "$(git rev-parse HEAD:tools/ci/verify_pr.py)" \
              --arg lock "$(git rev-parse HEAD:packages/aitm-usage/uv.lock)" \
              --arg inventory "$(sha256sum "$input/pytest.json" | cut -d' ' -f1)" \
              --arg source_inventory "$(sha256sum "$input/product-inventory.json" | cut -d' ' -f1)" \
              --arg baseline "$(sha256sum "$RUNNER_TEMP/aitm-baseline/base.json" | cut -d' ' -f1)" \
              --slurpfile result "$out/disposition.json" --slurpfile child "$input/children.json" \
              --slurpfile timings "$input/timings.json" --slurpfile provider_timing "$out/provider-timing.json" --slurpfile wheel "$input/wheel.json" \
              --slurpfile platform "$input/capability.json" --slurpfile base_identity "$input/expected-base.json" \
              --slurpfile product "$input/product-coverage.json" --slurpfile helpers "$input/helper-coverage.json" \
              '{$schema,$run,$attempt,$pr,$head,$base,$tested,$tree,$inventory,$source_inventory,$baseline,
                controls:{$policy,$workflow,$observer,$gate,$lock,$verifier},jobs:($jobs|map_values(.result)),
                checkouts:(($jobs|map_values(.outputs.checkout))+{collector:$tested}),
                result:$result[0],children:$child[0].children,timings:($timings[0]+$provider_timing[0]),wheel:$wheel[0].digest,
                platform:$platform[0],base_identity:$base_identity[0],
                branches:{product:($product[0].totals|{covered_branches,num_branches}),
                helpers:($helpers[0].totals|{covered_branches,num_branches})}}' > "$out/candidate.json"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        id: upload
        with:
          name: aitm-ci-collector-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/aitm-collector/candidate.json
          if-no-files-found: error
          overwrite: false

  aitm-ci:
    needs: collect-evidence
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Authorize the exact collector archive
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTOR_ID: ${{ needs.collect-evidence.outputs.artifact-id }}
          COLLECTOR_DIGEST: ${{ needs.collect-evidence.outputs.artifact-digest }}
        shell: bash
        run: |
          [[ "$COLLECTOR_ID" =~ ^[1-9][0-9]*$ ]]
          digest="${COLLECTOR_DIGEST#sha256:}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          expected_name="aitm-ci-collector-a$GITHUB_RUN_ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$COLLECTOR_ID" |
            jq -e --arg id "$COLLECTOR_ID" --arg run "$GITHUB_RUN_ID" \
              --arg name "$expected_name" --arg digest "sha256:$digest" '
              (.id | tostring) == $id and
              (.workflow_run.id | tostring) == $run and
              .name == $name and .digest == $digest and
              .expired == false and
              (.size_in_bytes | type == "number" and . > 0 and . <= 2097152)
            ' > /dev/null
          printf 'id=%s\ndigest=%s\n' "$COLLECTOR_ID" "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.authorize.outputs.id }}
          path: ${{ runner.temp }}/binding-raw
          skip-decompress: true
          digest-mismatch: error
      - name: Validate the archive and recover only the fixed subject
        env:
          EXPECTED_SHA256: ${{ steps.authorize.outputs.digest }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import stat
          import zipfile

          root = Path(os.environ["RUNNER_TEMP"])
          archive, = (root / "binding-raw").iterdir()
          if not stat.S_ISREG(archive.lstat().st_mode) or archive.stat().st_size > 2**21:
              raise SystemExit("invalid raw artifact")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ["EXPECTED_SHA256"]:
              raise SystemExit("collector archive digest mismatch")
          with zipfile.ZipFile(archive) as package:
              member, = package.infolist()
              mode = stat.S_IFMT(member.external_attr >> 16)
              if member.orig_filename != "candidate.json" or mode not in (0, stat.S_IFREG) or member.file_size > 2**20:
                  raise SystemExit("invalid collector archive member")
              with package.open(member) as source:
                  subject = source.read(2**20 + 1)
          import json

          report = json.loads(subject)
          if (
              report.get("schema") != "aitm.ci-candidate/v2"
              or report.get("run") != int(os.environ["GITHUB_RUN_ID"])
              or report.get("attempt") != int(os.environ["GITHUB_RUN_ATTEMPT"])
              or report.get("tested") != os.environ["GITHUB_SHA"]
              or report.get("result", {}).get("passed") is not True
          ):
              raise SystemExit("invalid candidate evidence")
          destination = root / "binding-signed"
          destination.mkdir()
          (destination / "candidate.json").write_bytes(subject)
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: ${{ runner.temp }}/binding-signed/candidate.json
          push-to-registry: false
          create-storage-record: false
      - name: Copy the bundle to the evidence directory
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          test -f "$BUNDLE_PATH"
          test ! -L "$BUNDLE_PATH"
          cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/binding-signed/attestation.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aitm-ci-evidence-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/binding-signed/
          if-no-files-found: error
          overwrite: false
